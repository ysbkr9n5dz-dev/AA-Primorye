name: Update daily reflections for website v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aa-v2-readings.yml
      - .github/scripts/sync-v2-readings.py
      - tools/build_content.py
  schedule:
    - cron: '15 14,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: aa-v2-daily-reflections
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh AA25 reflections
        run: python3 .github/scripts/sync-v2-readings.py
      - name: Save updated v2 archive
        id: save
        run: |
          if git diff --quiet -- v2/content; then
            echo 'No new reflections.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/content/readings.json v2/content/content.js
          git commit -m 'Refresh AA25 daily reflections for website v2'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages after updating reflections
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds > /dev/null
