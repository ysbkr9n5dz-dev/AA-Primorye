name: Build site content
on:
  push:
    branches: [main]
    paths:
      - 'v2/content/*.json'
      - tools/build_content.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON and rebuild content.js
        run: python3 tools/build_content.py
      - name: Save content.js if it changed
        run: |
          if git diff --quiet -- v2/content/content.js; then echo 'content.js up to date'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/content/content.js
          git commit -m 'Rebuild content.js from v2/content/*.json'
          git push origin HEAD:main
