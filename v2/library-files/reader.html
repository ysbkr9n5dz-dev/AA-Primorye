<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Читать PDF</title><style>
*{box-sizing:border-box}html,body{height:100%;overscroll-behavior:none}body{margin:0;background:#e9e9e5;color:#263962;font:14px system-ui,-apple-system,'Golos Text',sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.tools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:#fbfaf6;border-bottom:1px solid #cbd0d6}
.tools button,.tools input{min-height:44px;border:1px solid #c5ccd5;border-radius:4px;background:#fff}.tools button{min-width:44px;padding:8px 12px;cursor:pointer}.tools button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #304474;outline-offset:2px}
.tools input{width:60px;text-align:center}output{min-width:50px;text-align:center;font-variant-numeric:tabular-nums}.group{display:flex;align-items:center;gap:6px}
.stage{overflow:auto;overscroll-behavior:none;height:calc(100vh - 66px);height:calc(100svh - 66px);padding:20px;position:relative}
.sheet{position:relative;width:max-content;margin:0 auto;box-shadow:0 3px 15px #22304426;background:#fff}
.sheet canvas{display:block;background:#fff}.sheet canvas.leaving{position:absolute;left:0;top:0;box-shadow:0 2px 10px #2230442e}.stage.turning{overflow:hidden}.stage.turning .sheet{box-shadow:none;background:transparent}.stage.turning .sheet canvas{box-shadow:0 2px 10px #2230442e}
.status{padding:12px;text-align:center;margin:0;font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mbar,.toast{display:none}

/* ===== Телефон: полноэкранное чтение ===== */
@media (max-width:820px){
 .tools{display:none}
 body{overflow:hidden;background:#dcdcd6}
 .mbar{display:flex;align-items:center;gap:6px;position:fixed;left:0;right:0;z-index:3;background:#fbfaf6f2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s cubic-bezier(.22,1,.36,1)}
 .mbar.top{top:0;height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;border-bottom:1px solid #cbd0d6}
 .mbar.bottom{bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);border-top:1px solid #cbd0d6}
 .mbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#1c3b7d;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
 .mbtn:active{background:#1c3b7d14}.mbtn:disabled{opacity:.3}
 .mbtn svg{width:24px;height:24px}
 .mtitle{flex:1;min-width:0;font:400 17px/1.2 Literata,Georgia,serif;color:#1c3b7d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
 .mnav{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 4px}
 .mnav input{width:100%;margin:0;height:28px;accent-color:#1c3b7d}
 .mcount{font-size:12px;text-align:center;color:#55657d;font-variant-numeric:tabular-nums}
 .mzoom[aria-pressed="true"]{background:#1c3b7d;color:#fff}
 .stage{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top));bottom:calc(64px + env(safe-area-inset-bottom));height:auto;padding:8px;touch-action:manipulation;-webkit-overflow-scrolling:touch;transition:top .25s cubic-bezier(.22,1,.36,1),bottom .25s cubic-bezier(.22,1,.36,1)}
 .stage.zoomed{touch-action:pan-x pan-y pinch-zoom}
 .sheet{margin:0 auto;box-shadow:0 2px 10px #2230442e}
 body.immersive .mbar.top{transform:translateY(-100%)}
 body.immersive .mbar.bottom{transform:translateY(100%)}
 body.immersive .stage{top:0;bottom:0}
 .status{position:fixed;left:0;right:0;top:45%;z-index:2}
 .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:8px 8px 8px 14px;border-radius:10px;background:#1c3b7d;color:#fff;font-size:14px;box-shadow:0 8px 24px #10233d40;transition:opacity .25s}
 .toast[hidden]{display:none}
 .toast button{min-height:40px;padding:0 12px;border:1px solid #ffffff66;border-radius:6px;background:transparent;color:#fff;font:inherit;cursor:pointer}
}
@media (prefers-reduced-motion:reduce){.mbar,.stage{transition:none}}
</style>
<div class="tools" role="toolbar" aria-label="Управление чтением"><div class="group"><button id="prev" aria-label="Предыдущая страница">←</button><label class="sr-only" for="page">Страница</label><input id="page" type="number" min="1" value="1"><span id="total">/ …</span><button id="next" aria-label="Следующая страница">→</button></div><div class="group"><button id="out" aria-label="Уменьшить масштаб">−</button><output id="zoom" aria-label="Масштаб">100%</output><button id="in" aria-label="Увеличить масштаб">+</button><button id="fit">По ширине</button></div></div>

<header class="mbar top">
 <button class="mbtn" id="m-back" type="button" aria-label="Назад в библиотеку"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Назад</button>
 <div class="mtitle" id="m-title">Чтение</div>
 <a class="mbtn" id="m-download" href="#" target="_blank" rel="noopener" aria-label="Скачать PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
</header>

<p class="status" id="status" role="status">Загрузка книги…</p>
<div class="stage" id="stage" tabindex="0" aria-label="Страница книги"><div class="sheet" id="sheet"><canvas id="canvas" role="img" aria-label="Страница PDF"></canvas></div><p id="text" class="sr-only"></p></div>

<footer class="mbar bottom">
 <button class="mbtn" id="m-prev" type="button" aria-label="Предыдущая страница"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
 <div class="mnav"><label class="sr-only" for="m-range">Перейти к странице</label><input id="m-range" type="range" min="1" max="1" value="1"><span class="mcount" id="m-count">1 / …</span></div>
 <button class="mbtn" id="m-next" type="button" aria-label="Следующая страница"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
 <button class="mbtn mzoom" id="m-zoom" type="button" aria-pressed="false" aria-label="Увеличить текст">Aa</button>
</footer>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="toast-btn" type="button">С начала</button></div>

<script type="module">
import * as pdfjs from './pdfjs/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.mjs';
const $=id=>document.getElementById(id),allowed=['bigbook.pdf','steps.pdf','living.pdf','digest.pdf'];
const mob=matchMedia('(max-width:820px)'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const params=new URLSearchParams(location.search),file=params.get('file'),title=params.get('title')||'Чтение';
const KEY='aa-reader-page:'+file;
let pdf,page=1,scale=1,fit=true,zoomed=false,task=null,version=0,current=$('canvas'),swapAnims=[];

function store(n){try{localStorage.setItem(KEY,String(n))}catch(e){}}
function stored(){try{return parseInt(localStorage.getItem(KEY),10)||0}catch(e){return 0}}

function finishSwap(){swapAnims.forEach(a=>{try{a.finish()}catch(e){}});swapAnims=[];document.querySelectorAll('.sheet canvas.leaving').forEach(c=>c.remove());$('stage').classList.remove('turning')}

function ui(){
 const n=pdf.numPages;
 $('page').value=page;$('total').textContent='/ '+n;$('zoom').value=Math.round(scale*100)+'%';
 $('prev').disabled=page===1;$('next').disabled=page===n;$('out').disabled=scale<=.25;$('in').disabled=scale>=3;
 $('m-range').max=n;$('m-range').value=page;$('m-count').textContent=page+' / '+n;
 $('m-prev').disabled=page===1;$('m-next').disabled=page===n;
 $('m-zoom').setAttribute('aria-pressed',String(zoomed));$('m-zoom').setAttribute('aria-label',zoomed?'Вернуть по ширине':'Увеличить текст');
 $('stage').classList.toggle('zoomed',zoomed);
}

async function render(dir=0,focus=null){
 if(!pdf)return;const ticket=++version;
 if(task){task.cancel();try{await task.promise}catch(e){}if(ticket!==version)return}
 const p=await pdf.getPage(page);if(ticket!==version)return;
 const base=p.getViewport({scale:1}),stage=$('stage');
 if(mob.matches){const w=(stage.clientWidth-16)/base.width;scale=zoomed?w*2:w}
 else if(fit)scale=Math.min(2,Math.max(.25,(stage.clientWidth-40)/base.width));
 const view=p.getViewport({scale}),dpr=Math.min(devicePixelRatio||1,mob.matches?2.5:2);
 const c=document.createElement('canvas');c.width=Math.ceil(view.width*dpr);c.height=Math.ceil(view.height*dpr);c.style.width=view.width+'px';c.style.height=view.height+'px';
 c.setAttribute('role','img');c.setAttribute('aria-label','Страница '+page+' из '+pdf.numPages);
 task=p.render({canvasContext:c.getContext('2d'),viewport:view,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
 try{await task.promise}catch(e){if(e&&e.name==='RenderingCancelledException')return;fail(e);return}
 if(ticket!==version)return;
 $('status').hidden=true;
 swap(c,dir);
 if(focus){const r=focus;stage.scrollTo({left:Math.max(0,r.x*view.width-stage.clientWidth/2),top:Math.max(0,r.y*view.height-stage.clientHeight/2)})}
 else stage.scrollTo(0,0);
 ui();store(page);
 p.getTextContent().then(t=>{if(ticket===version)$('text').textContent=t.items.map(i=>i.str).join(' ')},()=>{});
}

function swap(next,dir){
 finishSwap();
 const sheet=$('sheet'),old=current;current=next;
 if(!dir||!mob.matches||reduced.matches||!old||!old.isConnected){if(old&&old.isConnected)old.replaceWith(next);else sheet.prepend(next);return}
 /* Страницы идут рядом, как лента: старая уходит целиком, новая въезжает с другой стороны */
 old.classList.add('leaving');sheet.prepend(next);
 const st=$('stage');st.classList.add('turning');
 const D=300,ease='cubic-bezier(.3,.7,.2,1)',gap=`calc(${-dir*100}% - ${dir*24}px)`;
 swapAnims=[
  old.animate([{transform:'translateX(0)'},{transform:`translateX(${gap})`}],{duration:D,easing:ease,fill:'forwards'}),
  next.animate([{transform:`translateX(calc(${dir*100}% + ${dir*24}px))`},{transform:'translateX(0)'}],{duration:D,easing:ease,fill:'backwards'})
 ];
 const done=()=>{old.remove();st.classList.remove('turning')};
 swapAnims[0].finished.then(done,done);
}

function fail(e){$('status').hidden=false;$('status').textContent='Не удалось показать PDF. Скачайте файл кнопкой вверху.';console.error(e)}
function move(n){if(!pdf)return;const t=Math.max(1,Math.min(pdf.numPages,n));if(t===page)return bump(n>page?1:-1);const dir=t>page?1:-1;page=t;render(dir)}
function bump(dir){if(!mob.matches||reduced.matches)return;$('sheet').animate([{transform:'translateX(0)'},{transform:`translateX(${-dir*12}px)`},{transform:'translateX(0)'}],{duration:240,easing:'ease-out'})}
function setZoom(on,focus){zoomed=on;render(0,on?focus:null)}

/* Компьютер: прежняя панель */
$('prev').onclick=()=>move(page-1);$('next').onclick=()=>move(page+1);$('page').onchange=()=>move(Number($('page').value)||1);
$('in').onclick=()=>{fit=false;scale=Math.min(3,Math.round((scale+.25)*100)/100);render()};$('out').onclick=()=>{fit=false;scale=Math.max(.25,Math.round((scale-.25)*100)/100);render()};$('fit').onclick=()=>{fit=true;render()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown'){move(page+1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){move(page-1);e.preventDefault()}});

/* Телефон: кнопки, ползунок, жесты */
$('m-title').textContent=title;document.title=title;
$('m-download').href=file||'#';
$('m-prev').onclick=()=>move(page-1);$('m-next').onclick=()=>move(page+1);
$('m-zoom').onclick=()=>setZoom(!zoomed,{x:.5,y:.3});
$('m-range').oninput=()=>{$('m-count').textContent=$('m-range').value+' / '+(pdf?pdf.numPages:'…')};
$('m-range').onchange=()=>move(Number($('m-range').value)||1);
$('m-back').onclick=()=>{
 if(window.parent!==window){try{window.parent.postMessage({aaReader:'close'},'*');return}catch(e){}}
 history.length>1?history.back():location.href='../#library';
};
function bars(show){document.body.classList.toggle('immersive',show===undefined?!document.body.classList.contains('immersive'):!show)}

const stage=$('stage');let t0=null,lastTap=0,tapTimer=0,multi=false;
stage.addEventListener('touchstart',e=>{if(!mob.matches)return;multi=e.touches.length>1;if(multi){t0=null;return}const t=e.touches[0];t0={x:t.clientX,y:t.clientY,time:Date.now(),sl:stage.scrollLeft}},{passive:true});
stage.addEventListener('touchend',e=>{
 if(!mob.matches||!t0||multi||e.touches.length)return;
 const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,dt=Date.now()-t0.time,start=t0;t0=null;
 /* Листание: горизонтальный жест, без увеличения или упёршись в край */
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<650){
  const atEdge=!zoomed||(dx<0?stage.scrollLeft+stage.clientWidth>=stage.scrollWidth-2:stage.scrollLeft<=1)&&Math.abs(stage.scrollLeft-start.sl)<2;
  if(atEdge){move(page+(dx<0?1:-1));return}
 }
 if(Math.abs(dx)>10||Math.abs(dy)>10||dt>350)return;
 e.preventDefault();
 const now=Date.now(),rect=current.getBoundingClientRect();
 if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;
  setZoom(!zoomed,{x:Math.min(1,Math.max(0,(t.clientX-rect.left)/rect.width)),y:Math.min(1,Math.max(0,(t.clientY-rect.top)/rect.height))});return}
 lastTap=now;const x=t.clientX/innerWidth;
 tapTimer=setTimeout(()=>{if(zoomed||(x>.28&&x<.72))bars();else move(page+(x>=.72?1:-1))},300);
},{passive:false});
stage.addEventListener('touchcancel',()=>{t0=null},{passive:true});
/* Горизонтальный жест забираем себе, чтобы браузер не уходил «назад» по истории */
stage.addEventListener('touchmove',e=>{if(!mob.matches||!t0||e.touches.length>1)return;const t=e.touches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;if(Math.abs(dx)>Math.abs(dy)&&(!zoomed||(dx<0?stage.scrollLeft+stage.clientWidth>=stage.scrollWidth-2:stage.scrollLeft<=1)))e.preventDefault()},{passive:false});

let resizeT;addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(mob.matches||fit)render()},150)});
mob.addEventListener('change',()=>{zoomed=false;document.body.classList.remove('immersive');render()});

function toast(text,btnText,onBtn){
 const el=$('toast');$('toast-text').textContent=text;$('toast-btn').textContent=btnText;el.hidden=false;
 $('toast-btn').onclick=()=>{el.hidden=true;onBtn()};
 clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},5000);
}

try{
 if(!allowed.includes(file))throw Error('Unknown PDF');
 pdf=await pdfjs.getDocument({url:file}).promise;$('page').max=pdf.numPages;
 const saved=stored();
 if(saved>1&&saved<=pdf.numPages){page=saved;await render();if(mob.matches)toast('Продолжаем со стр. '+saved,'С начала',()=>{page=1;render(-1)})}
 else await render();
}catch(e){fail(e)}
</script></html>
